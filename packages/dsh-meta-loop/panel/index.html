<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>元方法轮 · Meta Loop</title>
<style>
:root{--bg:#faf9f7;--panel:#fff;--ink:#111827;--sub:#6b7280;--line:#e7e2d9;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--brand:#6d5dfc;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 Inter,system-ui,'Microsoft YaHei',sans-serif}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:#fff}
header h1{font-size:14px;margin:0;font-weight:600}
header .mark{width:9px;height:9px;border-radius:50%;background:var(--brand);box-shadow:0 -6px 0 1.5px #a99cff,0 6px 0 1.5px #f0a35a}
header .sub{color:var(--sub);font-size:12px}
header .spacer{flex:1}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer}
button:hover{background:#f3f4f6}
main{padding:14px 16px;max-width:1240px;margin:0 auto}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.hint{color:var(--sub);font-size:12px}
.loop{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.loop>summary{cursor:pointer;padding:10px 14px;display:flex;align-items:center;gap:10px;list-style:none;flex-wrap:wrap}
.loop>summary::-webkit-details-marker{display:none}
.loop>summary:hover{background:#fcfcfb}
.loop .tname{font-weight:600}
.loop .badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 8px;line-height:18px;color:var(--sub)}
.loop .badge.g{color:#065f46;border-color:#a7f3d0;background:#ecfdf5}
.details{padding:8px 14px 14px;border-top:1px dashed var(--line);display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:820px){.details{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fcfcfb;min-width:0}
.card h3{margin:0 0 6px;font-size:12px;color:var(--sub);font-weight:600}
.card .mini{font-size:11px}
.card .mini li{margin:2px 0}
.badge2{display:inline-block;font-size:10px;border-radius:6px;padding:0 6px;line-height:16px;margin:1px 3px 1px 0;border:1px solid var(--line);background:#fff}
.badge2.adopt{border-color:#a7f3d0;background:#ecfdf5;color:#065f46}
.badge2.hold{border-color:#fde68a;background:#fffbeb;color:#92400e}
.badge2.drop{border-color:var(--line);color:var(--sub);text-decoration:line-through}
.badge2.ample{color:#065f46;border-color:#a7f3d0;background:#ecfdf5}
.badge2.tight{color:#92400e;border-color:#fde68a;background:#fffbeb}
.badge2.negative{color:#991b1b;border-color:#fecaca;background:#fef2f2}
.badge2.unknown{color:var(--sub)}
.agg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.agg b{color:var(--ink)}
.empty{color:var(--sub);padding:30px;text-align:center}
.trig{font-size:11px;color:var(--sub)}
.trig b{color:var(--warn)}
.rrow{display:flex;gap:8px;align-items:center;font-size:12px;padding:2px 0}
.rdot{width:8px;height:8px;border-radius:50%;background:#d1d5db;flex:none}
.rdot.g{background:var(--ok)}
.rdot.r{background:var(--brand)}
/* ── 六阶段流程图（节点+箭头+回环，展示方式对齐「思维图」的节点-连线画布） ── */
.flow-card{border:1px solid var(--line);border-radius:10px;background:#fff;margin:0 14px 12px;overflow:hidden}
.flow-head{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);background:#fcfcfb;flex-wrap:wrap}
.flow-head h3{margin:0;font-size:12px;color:var(--sub);font-weight:600}
.flow-head .spacer{flex:1}
.flow-head button{padding:2px 9px;font-size:11px;border-radius:8px}
.flow-scroll{overflow:auto;cursor:grab;background:#fff}
.flow-scroll.dragging{cursor:grabbing}
svg.flow{display:block;height:320px;touch-action:none;user-select:none}
svg.flow text{font-family:Inter,system-ui,'Microsoft YaHei',sans-serif}
.flow-legend{display:flex;gap:14px;flex-wrap:wrap;padding:6px 10px;border-top:1px dashed var(--line);font-size:11px;color:var(--sub)}
.flow-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1.5px solid var(--line)}
.flow-legend i.done{border-color:#a7f3d0;background:#f7fefb}
.flow-legend i.cur{border-color:var(--brand);background:#f4f2ff}
.flow-legend i.wait{border-color:#dfe3ea;background:#fbfbfd;border-style:dashed}
.flow-legend i.fail{border-color:#fecaca;background:#fff7f7}
</style>
</head>
<body>
<header>
  <i class="mark"></i><h1>元方法轮 · Meta Loop</h1>
  <span class="sub">反馈 → 分析(1115) → 策划(六类) → 决策(APX+裕度) → 实施 → 总体检视</span>
  <span class="spacer"></span>
  <button id="refresh">刷新</button>
</header>
<main>
  <div class="toolbar hint"><span id="note">读取 <code>tree-engine-data/<tree>.meta-loop.json</code> 与同目录树执行状态（只读）</span></div>
  <div id="app"><div class="empty">加载中…</div></div>
</main>
<script>
const $ = (s, el=document) => el.querySelector(s)
/* 转义表用运行时拼接实体(源码里不写真体,防止被编辑器/工具解码成恒等映射——2026-10-13 事故) */
function esc(x){ return String(x).replace(/[&<>"']/g, c => ({ '&': '&' + 'amp;', '<': '&' + 'lt;', '>': '&' + 'gt;', '"': '&' + 'quot;', "'": '&#' + '39;' }[c])) }

const STAGE_CN = { feedback:'反馈', analysis:'分析·1115', planning:'策划·六类', decision:'决策·APX', implementation:'实施', retro:'总体检视' }
const STAGES = ['feedback','analysis','planning','decision','implementation','retro']

/* ── 流程图几何常量(纯数字,渲染只依赖字符串拼接 → node:vm 烟测里也能跑) ── */
const G = { w:168, h:86, gap:46, padX:26, topY:46, camH:320 }
const FLOW_W = G.padX*2 + STAGES.length*G.w + (STAGES.length-1)*G.gap
const FLOW_H = 236

function clip(s, n){ s = String(s ?? ''); return s.length > n ? s.slice(0, n-1) + '…' : s }

/** 阶段状态:done | cur | wait(与轮次推进同源) */
function stageState(cycle, st){
  const idx = STAGES.indexOf(cycle?.stage)
  const cur = STAGES.indexOf(st)
  if (idx < 0 || cur < 0) return 'wait'
  return cur < idx ? 'done' : (cur === idx ? 'cur' : 'wait')
}

function verdictBadge(v) {
  if (!v) return '<span class="badge">open</span>'
  return v.verdict === 'green' ? '<span class="badge g">green</span>' : `<span class="badge">recurse</span>`
}

/** 每个阶段在节点里显示的「进度摘要」——取该轮真实内容计数,空则不写行 */
function stageSummary(st, src){
  const s = src ?? {}
  if (st === 'feedback') return `证据 ${(s.entries ?? []).length} 条`
  if (st === 'analysis') {
    const bps = s.breakpoints ?? []
    const open = bps.filter(b => b.open).length
    const fq = s.five_questions ?? {}
    const answered = ['q1','q2','q3','q4','q5'].filter(k => fq[k] !== undefined && fq[k] !== null && fq[k] !== '').length
    return `断点 ${bps.length}(${open}开) · 五问 ${answered}/5`
  }
  if (st === 'planning') return `动作 ${(s.actions ?? []).length} 项`
  if (st === 'decision') {
    const rs = s.rulings ?? []
    const ms = s.margins ?? []
    const adopted = rs.filter(r => r.verdict === 'adopt').length
    return `裁决 ${rs.length}(采用${adopted}) · 裕度 ${ms.length}`
  }
  if (st === 'implementation') {
    const cl = s.checklist ?? []
    return `清单 ${cl.filter(c => c.checked).length}/${cl.length} 已勾`
  }
  if (st === 'retro') {
    const te = s.trigger_evaluation ?? []
    return `触发 ${te.filter(t => t.fires).length}/${te.length} 命中`
  }
  return ''
}

/** 门禁状态 → 文案 + 颜色 */
function gateInfo(gate){
  if (!gate) return { text:'—', color:'#c7cdd6' }
  return gate.status === 'pass'
    ? { text:'✅ 门禁过', color:'#16a34a' }
    : { text:'⛔ 门禁停', color:'#dc2626' }
}

/**
 * 六阶段流程图:节点(圆角卡片) + 箭头连线 + 总体检视→反馈 的回环边 + 开轮触发/轮次标记。
 * 只返回 SVG 字符串(不碰 DOM),交互由 wireFlow 在浏览器里另挂(沙箱里自动跳过)。
 */
function flowSVG(loopId, s, cur, picks){
  const uid = 'f' + String(loopId).replace(/[^A-Za-z0-9_-]/g, '')
  const rowMid = G.topY + G.h/2
  const out = []
  const meta = {}

  // 先算每个节点的内容
  STAGES.forEach((st, i) => {
    const state = stageState(cur, st)
    const p = picks(st)
    const gate = gateInfo(p.src?.gate)
    /* 未到的阶段不显示上一轮的门禁结论(会误读成"本轮已过");只有明确的⛔才透出 */
    const gateShown = state === 'wait' && !gate.text.startsWith('⛔') ? { text:'—', color:'#c7cdd6' } : gate
    meta[st] = {
      i, state, gate: gateShown,
      x: G.padX + i*(G.w + G.gap),
      y: G.topY,
      tag: state === 'cur' ? `R${cur?.round ?? '?'}` : '',
      summary: state === 'wait' ? '待执行' : clip(stageSummary(st, p.src), 26),
      stale: p.round !== null && p.round !== cur?.round ? `R${p.round}` : '',
    }
  })

  // ── defs:三色箭头 ──
  out.push(`<defs>${['done','cur','wait','fail'].map(k => {
    const color = { done:'#a7f3d0', cur:'#6d5dfc', wait:'#dfe3ea', fail:'#fecaca' }[k]
    return `<marker id="${uid}-ar-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${color}"/></marker>`
  }).join('')}</defs>`)

  // ── 主连线(阶段之间的箭头):来源阶段的状态决定颜色 ──
  STAGES.forEach((st, i) => {
    if (i === STAGES.length - 1) return
    const a = meta[st], b = meta[STAGES[i+1]]
    const color = a.gate.text.startsWith('⛔') ? 'fail' : (a.state === 'done' ? 'done' : (a.state === 'cur' ? 'cur' : 'wait'))
    const stroke = { done:'#a7f3d0', cur:'#6d5dfc', wait:'#dfe3ea', fail:'#fecaca' }[color]
    const x1 = a.x + G.w, x2 = b.x
    const solid = a.state !== 'wait'
    out.push(`<path class="edge" d="M${x1},${rowMid} L${x2-6},${rowMid}" fill="none" stroke="${stroke}" stroke-width="${a.state==='cur'?2.4:2}" ${solid?'':'stroke-dasharray="5 5"'} marker-end="url(#${uid}-ar-${color})"/>`)
  })

  // ── 回环边:总体检视 → 反馈(方法轮的递归本质) ──
  const last = meta[STAGES[STAGES.length-1]], first = meta[STAGES[0]]
  const lastClosed = (s.rounds ?? []).filter(r => r.verdict).slice(-1)[0]
  const recurse = lastClosed?.verdict !== 'green'
  const loopColor = recurse ? '#6d5dfc' : '#16a34a'
  const backY = G.topY + G.h + 62
  const x6 = last.x + G.w/2, x1 = first.x + G.w/2
  out.push(`<path class="edge back" d="M${x6},${last.y+G.h} L${x6},${backY} L${x1},${backY} L${x1},${first.y+G.h+7}" fill="none" stroke="${loopColor}" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#${uid}-ar-${recurse?'cur':'done'})" opacity="${lastClosed?1:.35}"/>`)
  const loopLabel = !lastClosed ? `R${cur?.round ?? '?'} 进行中（未检视）`
    : recurse ? `recurse ⇒ 下一轮 R${(cur?.round ?? 0) + 1}`
    : 'green ⇒ 可宣告稳定/收束'
  const lw = Math.max(120, loopLabel.length * 7.4)
  out.push(`<g><rect x="${(x1+x6)/2 - lw/2}" y="${backY-11}" width="${lw}" height="22" rx="11" fill="#fff" stroke="${loopColor}" opacity="0.96"/><text x="${(x1+x6)/2}" y="${backY+4}" text-anchor="middle" font-size="11" fill="${loopColor}">${esc(loopLabel)}</text></g>`)

  // ── 节点 ──
  STAGES.forEach((st) => {
    const m = meta[st]
    const box = m.gate.text.startsWith('⛔') ? 'fail' : m.state
    const stroke = { done:'#a7f3d0', cur:'#6d5dfc', wait:'#dfe3ea', fail:'#fecaca' }[box]
    const fill = { done:'#f7fefb', cur:'#f6f4ff', wait:'#fbfbfd', fail:'#fff7f7' }[box]
    out.push(`<g class="node ${box}" data-stage="${st}" data-state="${m.state}">`)
    if (m.state === 'cur') out.push(`<rect x="${m.x-4}" y="${m.y-4}" width="${G.w+8}" height="${G.h+8}" rx="15" fill="#6d5dfc" opacity="0.08"/>`)
    out.push(`<rect class="n-box ${box}" x="${m.x}" y="${m.y}" width="${G.w}" height="${G.h}" rx="12" fill="${fill}" stroke="${stroke}" stroke-width="${box==='cur'?2.4:1.5}" ${box==='wait'?'stroke-dasharray="6 5"':''}/>`)
    out.push(`<text class="n-t" x="${m.x+12}" y="${m.y+22}" font-size="12.5" font-weight="600" fill="#111827">${esc(STAGE_CN[st])}</text>`)
    out.push(`<text x="${m.x+12}" y="${m.y+37}" font-size="10" fill="#9ca3af">${esc(st)}${m.stale?` · 数据来自 ${esc(m.stale)}`:''}</text>`)
    out.push(`<text x="${m.x+12}" y="${m.y+57}" font-size="11" fill="#4b5563">${esc(m.summary)}</text>`)
    out.push(`<text x="${m.x+12}" y="${m.y+75}" font-size="11" fill="${m.gate.color}">${esc(m.gate.text)}</text>`)
    if (m.tag) out.push(`<g><rect x="${m.x+G.w-40}" y="${m.y-10}" width="40" height="19" rx="9.5" fill="#6d5dfc"/><text x="${m.x+G.w-20}" y="${m.y+3.5}" text-anchor="middle" font-size="10.5" fill="#fff">${esc(m.tag)}</text></g>`)
    out.push('</g>')
  })

  // ── 开轮触发(挂在「反馈」节点上方) ──
  const trigs = [...new Set((cur?.trigger_signals ?? []).map(t => t?.source).filter(Boolean))]
  if (trigs.length) {
    const t = `开轮: ${clip(trigs.join(' · '), 30)}`
    const tw = Math.max(110, t.length * 7 + 16)
    out.push(`<g><rect x="${first.x}" y="${G.topY-34}" width="${tw}" height="22" rx="11" fill="#fffbeb" stroke="#fde68a"/><text x="${first.x+tw/2}" y="${G.topY-19}" text-anchor="middle" font-size="11" fill="#92400e">${esc(t)}</text></g>`)
    out.push(`<path d="M${first.x+tw/2},${G.topY-12} L${first.x+tw/2},${G.topY-1}" stroke="#fde68a" stroke-width="1.5" fill="none" marker-end="url(#${uid}-ar-wait)"/>`)
  }

  return `<svg class="flow" viewBox="0 0 ${FLOW_W} ${FLOW_H + 40}" width="${FLOW_W}" data-tree="${esc(loopId)}" preserveAspectRatio="xMinYMin meet">${out.join('')}</svg>`
}

/* ── 视图状态(拖动/缩放) —— 每棵树独立,重渲染时若无数据变化则保留 ── */
const views = {}
let lastPayload = ''

function applyView(svg){
  const v = views[svg.dataset.tree]
  if (!v) return
  const cam = svg.querySelector('g.cam')
  if (cam) cam.setAttribute('transform', `translate(${v.x},${v.y}) scale(${v.s})`)
}

function setView(svg, patch){
  const key = svg.dataset.tree
  const v = views[key] ?? (views[key] = { s:1, x:0, y:0 })
  Object.assign(v, patch)
  applyView(svg)
}

/** 适应宽度:缩放到滚动容器宽度(不小于 0.45,否则字太小),并回到原点 */
function fitFlow(svg){
  const box = svg.closest && svg.closest('.flow-scroll')
  const w = box && box.clientWidth ? box.clientWidth : 0
  const s = w > 0 ? Math.min(1, Math.max(0.45, w / FLOW_W)) : 1
  setView(svg, { s, x: 0, y: 0 })
}

/** 给画布挂拖动/滚轮缩放。沙箱(node:vm)里没有 window,自动跳过 → 烟测只测字符串渲染。 */
function wireFlow(root){
  if (typeof window === 'undefined' || typeof document.addEventListener !== 'function') return
  if (!root || typeof root.querySelectorAll !== 'function') return
  root.querySelectorAll('svg.flow').forEach((svg) => {
    if (svg.dataset.wired) { applyView(svg); return }
    svg.dataset.wired = '1'
    // 把内容包进 <g class="cam"> 以便整体变换
    const cam = document.createElementNS('http://www.w3.org/2000/svg', 'g')
    cam.setAttribute('class', 'cam')
    while (svg.firstChild) cam.appendChild(svg.firstChild)
    svg.appendChild(cam)
    let dragging = false, lastX = 0, lastY = 0
    svg.addEventListener('pointerdown', (e) => {
      dragging = true; lastX = e.clientX; lastY = e.clientY
      svg.setPointerCapture?.(e.pointerId)
      svg.closest('.flow-scroll')?.classList.add('dragging')
    })
    svg.addEventListener('pointermove', (e) => {
      if (!dragging) return
      const v = views[svg.dataset.tree] ?? (views[svg.dataset.tree] = { s:1, x:0, y:0 })
      views[svg.dataset.tree] = { s:v.s, x:v.x + (e.clientX - lastX), y:v.y + (e.clientY - lastY) }
      lastX = e.clientX; lastY = e.clientY
      applyView(svg)
    })
    svg.addEventListener('pointerup', () => { dragging = false; svg.closest('.flow-scroll')?.classList.remove('dragging') })
    svg.addEventListener('pointercancel', () => { dragging = false })
    svg.addEventListener('wheel', (e) => {
      e.preventDefault()
      const v = views[svg.dataset.tree] ?? (views[svg.dataset.tree] = { s:1, x:0, y:0 })
      const k = e.deltaY < 0 ? 1.12 : 1/1.12
      const s = Math.min(2.6, Math.max(0.45, v.s * k))
      // 以指针为锚点缩放
      const r = svg.getBoundingClientRect()
      const px = e.clientX - r.left, py = e.clientY - r.top
      views[svg.dataset.tree] = { s, x: px - (px - v.x) * (s / v.s), y: py - (py - v.y) * (s / v.s) }
      applyView(svg)
    }, { passive:false })
    /* 首绘:按容器宽度自适应;之后保留用户拖动/缩放出来的视图 */
    if (views[svg.dataset.tree]) applyView(svg); else fitFlow(svg)
  })
}

/* 视图按钮(适应/100%/±) */
function wireFlowButtons(root){
  if (typeof window === 'undefined' || typeof document.addEventListener !== 'function') return
  if (!root || typeof root.querySelectorAll !== 'function') return
  root.querySelectorAll('[data-flow-ctl]').forEach((b) => {
    if (b.dataset.wired) return
    b.dataset.wired = '1'
    b.addEventListener('click', () => {
      const svg = b.closest('.flow-card')?.querySelector('svg.flow')
      if (!svg) return
      const act = b.dataset.flowCtl
      const v = views[svg.dataset.tree] ?? (views[svg.dataset.tree] = { s:1, x:0, y:0 })
      if (act === 'fit') fitFlow(svg)
      else if (act === 'reset') setView(svg, { s:1 })
      else if (act === 'in') setView(svg, { s: Math.min(2.6, v.s * 1.18) })
      else if (act === 'out') setView(svg, { s: Math.max(0.45, v.s / 1.18) })
    })
  })
}

function flowCard(id, s, cur, picks){
  const lastClosed = (s.rounds ?? []).filter(r => r.verdict).slice(-1)[0]
  const roundsPath = (s.rounds ?? []).map(r => `R${r.round}${r.verdict ? ':' + esc(r.verdict) : ':进行中'}`).join(' → ')
  return `<div class="flow-card">
    <div class="flow-head"><h3>六阶段流程图（当前 ${STAGE_CN[cur?.stage] ?? '?'}）</h3>
      <span class="badge">${roundsPath || '—'}</span>
      <span class="spacer"></span>
      <button data-flow-ctl="out" title="缩小">−</button>
      <button data-flow-ctl="reset" title="100%">1:1</button>
      <button data-flow-ctl="in" title="放大">＋</button>
      <button data-flow-ctl="fit" title="适应宽度">适应</button>
    </div>
    <div class="flow-scroll">${flowSVG(id, s, cur, picks)}</div>
    <div class="flow-legend">
      <span><i class="done"></i>已通过</span><span><i class="cur"></i>当前阶段</span><span><i class="wait"></i>待执行</span><span><i class="fail"></i>门禁停</span>
      <span>连线：实线=已推进，虚线=未到；回环边 ${lastClosed?.verdict === 'green' ? 'green(可收束)' : lastClosed ? 'recurse(回到反馈)' : '未检视'}</span>
      <span>拖动平移 · 滚轮缩放</span>
    </div>
  </div>`
}

function renderLoop(id, data) {
  const s = data
  const cur = s.rounds?.[s.rounds.length-1]
  const lastClosed = s.rounds?.filter(r=>r.verdict).slice(-1)[0]
  const agg = s._agg ?? {}
  /* 各阶段取「最近有内容的一轮」:当前轮常在 feedback(空壳),若只看当前轮会把上轮裁决/裕度/清单全藏掉 */
  const stageHasData = (o) => o && Object.entries(o).some(([k, v]) => k !== 'gate' && v !== undefined
    && !(Array.isArray(v) && v.length === 0) && !(v && typeof v === 'object' && !Array.isArray(v) && Object.keys(v).length === 0)
    && !(typeof v === 'string' && v === ''))
  const pick = (st) => {
    const a = cur?.stages?.[st]
    if (stageHasData(a)) return { src: a, round: cur.round }
    const b = lastClosed?.stages?.[st]
    return { src: b ?? {}, round: b ? lastClosed.round : null }
  }
  const tag = (p) => (p.round !== null && p.round !== cur?.round ? ` <span class="trig">(R${p.round})</span>` : '')
  const entries = pick('feedback').src.entries ?? []
  const aA = pick('analysis')
  const bp = (aA.src.breakpoints ?? []).map(b => `<li>${b.open?'🔴':'🟢'} ${esc(b.id??'')} ${esc(b.desc??'')}</li>`).join('') || '<i>无</i>'
  const fq = aA.src.five_questions ?? {}
  const aP = pick('planning')
  const acts = (aP.src.actions ?? []).map(a => `<li><span class="badge2">${esc(a.type??'')}</span> ${esc(a.target_breakpoint??'')} → ${esc(a.point??'')}</li>`).join('') || '<i>无</i>'
  const aD = pick('decision')
  const rulings = (aD.src.rulings ?? []).map(r => `<span class="badge2 ${esc(r.verdict)}">${esc(r.candidate??'')}·${esc(r.verdict)}</span>`).join(' ') || '<i>无</i>'
  const margins = (aD.src.margins ?? []).map(m => `<span class="badge2 ${esc(m.estimate)}">${esc(m.object??'')}: ${esc(m.estimate)}</span>`).join(' ') || '<i>无</i>'
  const aI = pick('implementation')
  const cl = (aI.src.checklist ?? []).map(c => `<li>${c.checked?'☑':'☐'} ${esc(c.text??'')}${c.checked&&c.evidence?` <span class="trig">(evidence)</span>`:''}</li>`).join('') || '<i>无</i>'
  const te = (lastClosed?.stages?.retro?.trigger_evaluation ?? []).map(t => `<li class="trig">${t.fires?'🔥':'·'} ${esc(t.trigger)} — ${esc(t.note??'')}</li>`).join('') || '<i>无</i>'
  const rounds = (s.rounds ?? []).map(r => `<span class="rrow"><span class="rdot ${r.verdict==='green'?'g':(r.verdict?'r':'')}"></span>R${r.round} ${r.verdict??'进行中'}</span>`).join(' ')
  const trigSig = (cur?.trigger_signals ?? []).map(t => `<span class="badge">${esc(t.source)}: ${esc((t.note??'').slice(0,60))}</span>`).join(' ')
  const stable = s.stable?.declared ? `<span class="badge g">稳定宣告 @R${s.stable.since_round}（可撤销）</span>` : `<span class="badge">绿连胜 ${s.stable?.green_streak ?? 0}</span>`
  return `<details class="loop" ${s.rounds && s.rounds.length<=1 && !s.rounds[0].verdict ? 'open':''}>
    <summary><span class="tname">${esc(id)}</span> <span class="badge">R${s.current_round} · ${STAGE_CN[cur?.stage] ?? cur?.stage ?? '?'}</span> ${stable} ${lastClosed?verdictBadge(lastClosed):''}${aggText(agg)}</summary>
    ${flowCard(id, s, cur, pick)}
    <div class="details">
      <div class="card"><h3>轮次轨迹</h3><div>${rounds}</div><div style="margin-top:6px">开轮触发：${trigSig||'<i>无</i>'}</div></div>
      <div class="card"><h3>树执行聚合（只读引擎状态）</h3><div class="agg"><span>leaves <b>${agg.leaves??'-'}</b></span><span>succeeded <b>${agg.runtime_succeeded??0}</b></span><span>fail/t/o <b>${(agg.runtime_failed??0)+(agg.runtime_timeout??0)+(agg.runtime_frozen??0)}</b></span><span>verify-FAIL <b>${agg.verify_fail??0}</b></span><span>high-drift <b>${agg.drift_high_severity??0}</b></span><span>未终态 <b>${Math.round((agg.active_ratio??0)*100)}%</b></span></div></div>
      <div class="card"><h3>反馈账本（G1 证据）${tag(pick('feedback'))}</h3><ul class="mini">${entries.map(e => `<li>${esc(e.source==='external'?'🌐':'・')} ${esc(e.event??'')} → ${esc(e.reaction??'')} <span class="trig">〔${esc(e.evidence??'')}〕</span></li>`).join('')}</ul></div>
      <div class="card"><h3>1115 · 断点（一链）${tag(aA)}</h3><ul class="mini">${bp}</ul><div>五问 Q4: ${esc(fq.q4??'-')} · Q5: ${esc(fq.q5??'-')}</div></div>
      <div class="card"><h3>策划（六类覆盖）${tag(aP)}</h3><ul class="mini">${acts}</ul></div>
      <div class="card"><h3>决策（APX 裁决 / 裕度）${tag(aD)}</h3><div>${rulings}</div><div>${margins}</div></div>
      <div class="card"><h3>实施清单${tag(aI)}</h3><ul class="mini">${cl}</ul></div>
      <div class="card"><h3>M4 触发判定（上轮检视）</h3><ul class="mini">${te}</ul></div>
    </div></details>`
}
function aggText(a){ if(!a || a.leaves===undefined) return ''; return `<span class="badge">leaves ${a.leaves} · ok ${a.runtime_succeeded??0} · 未终态 ${Math.round((a.active_ratio??0)*100)}%</span>` }

async function load(){
  try {
    const r = await fetch('/metaloop/api/loops')
    const j = await r.json()
    const app = $('#app')
    if (!j.loops || !j.loops.length) { app.innerHTML = '<div class="empty">还没有方法轮。在会话中调用工具 meta_loop {action:"init", tree_id:…, triggers:[…]} 开轮。</div>'; return }
    /* 数据没变就不重绘:保住拖动/缩放出来的视图(before 前每 15s 重绘会把视图打回原点) */
    const payload = JSON.stringify(j)
    if (payload !== lastPayload) {
      lastPayload = payload
      app.innerHTML = j.loops.map(l => renderLoop(l.tree_id, l)).join('')
      wireFlow(app)
      wireFlowButtons(app)
    }
  } catch (e) { $('#app').innerHTML = `<div class="empty">加载失败: ${esc(e.message)}</div>` }
}
$('#refresh').addEventListener('click', () => { lastPayload = ''; load() })
load(); setInterval(load, 15000)
</script>
</body>
</html>
